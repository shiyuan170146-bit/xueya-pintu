<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学涯拼图 · 培养方案与选课提醒</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 6 H26 a7 7 0 0 1 14 0 H58 V26 a7 7 0 0 1 0 14 V58 H6 Z' fill='%237b915c' stroke='%234a4535' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/app.css?v=20261103a" />
</head>
<body>
<!-- WorkBuddy 云服务 SDK（本地 vendor，避免外网 CDN 被墙）：提供 window.WorkBuddyCloud -->
<script defer src="assets/cloud-client.js"></script>
<!-- SheetJS：浏览器端读写 .xlsx（导入模板下载 / 成绩单导入导出） -->
<script defer src="assets/vendor/xlsx.full.min.js"></script>
<!-- pdf.js：直接读教务系统导出的 PDF（成绩单 / 正在修读课表），本地 vendor 离线可用 -->
<script defer src="assets/vendor/pdf.min.js"></script>
<script defer src="assets/pdf-import.js?v=20261103a"></script>

<!-- ============ 手绘 SVG 符号库（装饰用） ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="duck" viewBox="0 0 180 160">
    <ellipse cx="90" cy="120" rx="54" ry="34" fill="#fbe6a6" stroke="#3f3a33" stroke-width="3.5"/>
    <circle cx="90" cy="74" r="44" fill="#fdeeb8" stroke="#3f3a33" stroke-width="3.5"/>
    <path d="M84,34 q8,-14 18,-6" stroke="#f0b04c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="70" r="4.6" fill="#3f3a33"/><circle cx="106" cy="70" r="4.6" fill="#3f3a33"/>
    <circle cx="75.6" cy="68.4" r="1.6" fill="#fff"/><circle cx="107.6" cy="68.4" r="1.6" fill="#fff"/>
    <path d="M74,88 q16,16 32,0 q-16,10 -32,0 Z" fill="#f2a860" stroke="#3f3a33" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="56" cy="84" rx="7" ry="4.5" fill="#f5b3c0"/><ellipse cx="124" cy="84" rx="7" ry="4.5" fill="#f5b3c0"/>
  </symbol>
  <symbol id="flower" viewBox="0 0 60 96">
    <path d="M30,92 C28,74 30,60 30,50" stroke="#5c7a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M30,72 q-12,-2 -14,-12 q12,0 14,12" fill="#7a9a5e"/>
    <g transform="translate(30,36)">
      <g fill="#f6d98a" stroke="#3f3a33" stroke-width="2.2">
        <ellipse cx="0" cy="-13" rx="6.5" ry="10"/>
        <ellipse cx="12" cy="-4" rx="6.5" ry="10" transform="rotate(72 12 -4)"/>
        <ellipse cx="7.5" cy="10.5" rx="6.5" ry="10" transform="rotate(144 7.5 10.5)"/>
        <ellipse cx="-7.5" cy="10.5" rx="6.5" ry="10" transform="rotate(216 -7.5 10.5)"/>
        <ellipse cx="-12" cy="-4" rx="6.5" ry="10" transform="rotate(288 -12 -4)"/>
      </g>
      <circle r="5.5" fill="#3f3a33"/>
    </g>
  </symbol>
  <symbol id="paw" viewBox="0 0 60 60">
    <ellipse cx="30" cy="38" rx="15" ry="12" fill="#c9d9b2"/>
    <ellipse cx="15" cy="22" rx="6" ry="7.5" fill="#c9d9b2"/>
    <ellipse cx="27" cy="16" rx="6" ry="7.5" fill="#c9d9b2"/>
    <ellipse cx="39" cy="18" rx="6" ry="7.5" fill="#c9d9b2"/>
    <ellipse cx="48" cy="26" rx="5.5" ry="7" fill="#c9d9b2"/>
  </symbol>
</defs></svg>

<!-- ============ 登录 / 注册 ============ -->
<div id="loginView" class="auth-wrap hidden">
  <div class="auth-stage">
    <svg class="deco-flower" viewBox="0 0 60 96" aria-hidden="true"><use href="#flower"/></svg>
    <div class="auth-card">
      <div class="auth-logo">拼</div>
      <h1 class="title-fun">学涯拼图</h1>
      <p class="auth-sub">每个学生都在拼自己的培养方案，缺的课就是缺的拼图块</p>
      <p class="auth-sub" style="font-size:12.5px;opacity:.82;margin-top:-10px">看懂培养方案 · 不错过选课 · 提前发现学分缺口</p>

      <!-- 密码登录（默认界面） -->
      <form id="formPwd" class="auth-form">
        <label>邮箱<input type="text" id="pwdEmail" required placeholder="you@example.com" /></label>
        <label>密码<input type="password" id="pwdPass" required placeholder="登录密码" /></label>
        <button type="submit" class="btn primary block">登 录</button>
        <button type="button" class="btn block" id="btnDemo">不注册，先进去看看</button>
      </form>

      <!-- 验证码注册 / 登录（仅邮箱：短信通道未开通） -->
      <form id="formOtp" class="auth-form hidden">
        <label id="otpEmailWrap">邮箱<input type="email" id="otpEmail" placeholder="you@example.com" /></label>

        <label>验证码
          <span class="inline">
            <input type="text" id="otpCode" maxlength="6" placeholder="6 位验证码" />
            <button type="button" class="btn" id="btnSendOtp">获取验证码</button>
          </span>
        </label>

        <!-- 首次注册才显示：学号进系统后再绑定 -->
        <div id="otpSignup" class="hidden">
          <label>设置登录密码<input type="password" id="otpPass" placeholder="至少 6 位，之后用它登录" /></label>
          <p class="bind-sub">注册成功进入系统后，再按提示绑定学号建立学生档案。</p>
        </div>
        <button type="submit" class="btn primary block">登录 / 注册</button>
      </form>

      <!-- 忘记密码 -->
      <form id="formForgot" class="auth-form hidden">
        <label>邮箱<input type="email" id="fgEmail" required placeholder="you@example.com" /></label>
        <button type="button" class="btn block" id="btnFgSend">发送重置验证码</button>
        <label>验证码<input type="text" id="fgCode" maxlength="6" placeholder="邮箱收到的验证码" /></label>
        <label>新密码<input type="password" id="fgNew" required placeholder="新密码（至少 6 位）" /></label>
        <button type="submit" class="btn primary block">重置密码</button>
      </form>

      <!-- 视图间跳转小字（登录 / 注册 / 忘记密码） -->
      <p class="auth-links" id="linksLogin">第一次使用？<a href="javascript:void(0)" id="linkToOtp">去注册</a><span class="sep">·</span><a href="javascript:void(0)" id="linkToForgot">忘记密码？</a></p>
      <p class="auth-links hidden" id="linksOtp">已有账号？<a href="javascript:void(0)" id="linkBackLogin1">返回登录</a></p>
      <p class="auth-links hidden" id="linksForgot"><a href="javascript:void(0)" id="linkBackLogin2">返回登录</a></p>

      <!-- 绑定学生身份（教师 / 管理员等旧账号专用） -->
      <div id="bindBox" class="hidden">
        <div class="bind-title">绑定学生身份</div>
        <p class="bind-sub" id="bindSub"></p>
        <label>学号<input type="text" id="bindSno" maxlength="13" placeholder="如 2024315220101" /></label>
        <label>姓名<input type="text" id="bindName" placeholder="真实姓名" /></label>
        <button type="button" class="btn primary block" id="btnBind">绑定并进入</button>
        <button type="button" class="btn block" id="btnBindBack">返回登录</button>
      </div>

      <p id="authMsg" class="auth-msg"></p>
      <p class="auth-tip">第一次使用请点「去注册」—— 用邮箱创建账号（学号不会作为登录凭证），进入系统后再绑定学号建立学生档案。绑定后导入你教务系统导出的成绩，系统会自动对照培养方案算出你差哪些课。</p>
    </div>
    <svg class="deco-duck" viewBox="0 0 180 160" aria-hidden="true"><use href="#duck"/></svg>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="appView" class="app hidden">
  <div class="topbar-wrap"><header class="topbar">
    <div class="brand"><span class="brand-mark">拼</span><span class="title-fun">学涯拼图</span></div>
    <div class="top-right">
      <span id="userBadge" class="badge"></span>
      <span id="userName"></span>
      <button class="btn ghost sm" id="btnLogout">退出登录</button>
    </div>
  </header></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="main" class="main"></main>
  </div>
  <svg class="mascot" viewBox="0 0 180 160" aria-hidden="true"><use href="#duck"/></svg>
  <svg class="mascot-paw p1" viewBox="0 0 60 60" aria-hidden="true"><use href="#paw"/></svg>
  <svg class="mascot-paw p2" viewBox="0 0 60 60" aria-hidden="true"><use href="#paw"/></svg>
</div>

<div id="toast" class="toast hidden"></div>
<div id="modalMask" class="modal-mask hidden"><div id="modalBox" class="modal-box"></div></div>
<div id="loading" class="loading hidden">加载中…</div>

<script defer src="assets/app.js?v=20261103a"></script>
</body>
</html>
